<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Os Pecados da Forca — Demo</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#e8e2c8;--gold:#f0d060;--stone:#2a3340;--stone2:#3d4a5a;--edge:#7d8ea0;--dark:#0b0d12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:manipulation}
body{font-family:'VT323',monospace;color:var(--ink)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--dark);image-rendering:pixelated}
#stage.side{width:1324px;height:687px}
#stage.bottom{width:1024px;height:907px}
#scene{position:absolute;left:0;top:0;width:1024px;height:687px;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;width:1024px;height:687px;image-rendering:pixelated}
#sprites,#hots{position:absolute;inset:0}
#sprites{pointer-events:none}
.spr{position:absolute;transform-origin:50% 100%;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.55))}
.spr.npc{pointer-events:auto;cursor:pointer}
.spr.idle{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{scale:1 1.018}}
.spr.walking{animation:walk .42s ease-in-out infinite}
@keyframes walk{0%,100%{margin-top:0;rotate:-1.6deg}50%{margin-top:-6px;rotate:1.6deg}}
.spr.dogwalk{animation:dogwalk .22s steps(2) infinite}
@keyframes dogwalk{50%{margin-top:-3px}}
.spr.talk{animation:talk .5s ease-in-out 2}
@keyframes talk{50%{margin-top:-5px}}
.hs.drop,.spr.drop,.slot.drop{outline:3px solid var(--gold);background:rgba(240,208,96,.18)}
#ghost{position:fixed;width:64px;height:64px;pointer-events:none;z-index:99;display:none;transform:translate(-50%,-60%);filter:drop-shadow(0 4px 6px #000);image-rendering:pixelated}
.slot{touch-action:none}
.gman{position:absolute;transform-origin:50% 100%;filter:drop-shadow(0 6px 4px rgba(0,0,0,.55));pointer-events:none}
.gman img{position:absolute;image-rendering:pixelated}
.gman .gst{position:absolute;left:0;bottom:0;width:100%;height:100%}
.gman .gwk{position:absolute;left:50%;bottom:0;height:100%;display:none}
.gman.walking .gst{display:none}.gman.walking .gwk{display:block}
.gman .gid{position:absolute;left:50%;bottom:0;height:100%;display:none}
.gman.idleanim:not(.walking) .gst{display:none}.gman.idleanim:not(.walking) .gid{display:block}
.spr.gman.walking{animation:none}
.hs{position:absolute;cursor:pointer}
.hs.flash{outline:3px dashed var(--gold);background:rgba(240,208,96,.15)}
.spr.flash{outline:3px dashed var(--gold)}
.exit{position:absolute;font-family:'Press Start 2P';font-size:15px;color:var(--gold);text-shadow:2px 2px 0 #000;display:flex;align-items:flex-end;justify-content:flex-start;padding:10px;pointer-events:none}
#dark{position:absolute;inset:0;pointer-events:none;display:none}
#rain{position:absolute;left:0;top:0;width:1024px;height:687px;pointer-events:none;display:none}
@keyframes rain{to{background-position:-40px 200px}}
#scene.lowsan #bg{animation:sway 4s ease-in-out infinite}
#scene.lowsan::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(120,0,0,.65)}
@keyframes sway{0%,100%{filter:var(--f) hue-rotate(0deg)}50%{filter:var(--f) hue-rotate(-25deg) contrast(1.2);transform:translateX(3px) scale(1.01)}}
#hud{position:absolute;right:14px;top:12px;font-family:'Press Start 2P';font-size:11px;pointer-events:none;text-shadow:2px 2px 0 #000}
.meter{display:flex;align-items:center;gap:8px;margin-bottom:8px;justify-content:flex-end}
.segs{display:flex;gap:2px;padding:3px;background:rgba(0,0,0,.6);border:2px solid var(--edge)}
.seg{width:11px;height:12px}
.seg.v{background:#d52a2a}.seg.s{background:#3a8ee6}.seg.off{background:#2a2a2a}
#pistas{pointer-events:auto;cursor:pointer;text-decoration:underline}
#hudl{position:absolute;left:14px;top:12px;font-family:'Press Start 2P';font-size:12px;pointer-events:none;text-shadow:2px 2px 0 #000;line-height:1.9}
#hudl img{height:22px;vertical-align:middle;margin-right:6px}
#timer{color:#ff8a5a;display:none}
#sentence{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:'Press Start 2P';font-size:14px;color:var(--gold);text-shadow:2px 2px 0 #000,-1px -1px 0 #000;pointer-events:none}
#toast{position:absolute;left:50%;top:120px;transform:translateX(-50%);font-family:'Press Start 2P';font-size:14px;color:#fff;background:rgba(0,0,0,.8);border:3px solid var(--gold);padding:12px 18px;display:none;pointer-events:none;white-space:nowrap;z-index:17}
#dlg{position:absolute;left:60px;right:60px;top:70px;min-height:150px;display:none;background:#0d0f14;border:6px solid var(--stone2);outline:3px solid #11161d;box-shadow:inset 0 0 0 3px #11161d,0 8px 30px rgba(0,0,0,.7);padding:14px;gap:16px;cursor:pointer;z-index:16}
#dlg.on{display:flex}
#dlg.narr{background:rgba(5,6,9,.92)}
#por{width:120px;height:120px;flex:none;border:4px solid var(--stone2);background:#000 center/cover;image-rendering:pixelated}
#por.none{display:none}
#dtext{flex:1;font-size:31px;line-height:1.08}
#dname{font-family:'Press Start 2P';font-size:13px;color:var(--gold);margin-bottom:8px}
#dlg.narr #dtext{font-style:italic;color:#cfd6e0}
#dmore{position:absolute;right:12px;bottom:6px;font-family:'Press Start 2P';font-size:12px;color:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#whisper{position:absolute;font-size:34px;color:rgba(200,30,30,.85);pointer-events:none;text-shadow:0 0 8px #000;opacity:0;transition:opacity .6s}
#panel{position:absolute;background:linear-gradient(#2c3643,#1d242e);border:5px solid var(--stone2);box-shadow:inset 0 0 0 3px #10151c;display:flex;padding:12px;gap:12px}
#stage.side #panel{left:1024px;top:0;width:300px;height:687px;flex-direction:column}
#stage.bottom #panel{left:0;top:687px;width:1024px;height:220px;flex-direction:row}
#verbs{display:grid;gap:8px;flex:none}
#stage.side #verbs{grid-template-columns:1fr 1fr}
#stage.bottom #verbs{grid-template-columns:repeat(3,150px);align-content:start}
.btn{font-family:'Press Start 2P';font-size:14px;color:var(--ink);background:linear-gradient(#56687b,#3a4757);border:3px solid #8fa1b3;border-bottom-color:#26303b;border-right-color:#26303b;padding:13px 6px;text-align:center;cursor:pointer;text-shadow:2px 2px 0 #1a2129}
.btn:active{transform:translateY(2px)}
.btn.sel{color:var(--gold);background:linear-gradient(#6a7f94,#46566a);outline:3px solid var(--gold)}
.btn.small{font-size:11px;padding:10px 6px}
#inv{background:#0c0f14;border:4px solid var(--stone2);padding:8px;display:grid;gap:6px;position:relative}
#inv h4{position:absolute;top:-2px;left:0;right:0;margin:0;text-align:center;font-family:'Press Start 2P';font-size:11px;color:var(--ink);transform:translateY(-120%)}
#stage.side #inv{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,78px);grid-auto-rows:78px;height:262px;align-content:start;margin-top:26px;flex:none;contain:layout size}
#stage.bottom #inv{grid-template-columns:repeat(5,72px);grid-auto-rows:72px;margin-left:auto;margin-top:22px}
.slot{background:#1e1f24;border:2px solid #2c333d;min-width:0;min-height:0;height:78px;box-sizing:border-box;overflow:hidden;-webkit-touch-callout:none;-webkit-user-drag:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:4px}
.slot img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;pointer-events:none}
.slot.sel{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
#tools{display:flex;gap:8px}
#stage.side #tools{margin-top:auto;flex:none}
#stage.bottom #tools{flex-direction:column;width:130px}
#tools .btn{flex:1;font-size:8px;padding:10px 1px}
#ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000;text-align:center}
#ov.on{display:flex}
#ov .title{font-family:'Press Start 2P';font-size:44px;color:#d9c48a;text-shadow:4px 4px 0 #3a0a0a,0 0 24px rgba(200,40,40,.5);line-height:1.3}
#ov .sub{font-size:34px;color:#b8c2cc;margin:14px 0 30px}
#ov .btn{min-width:330px;margin:7px;font-size:16px}
#ov p{font-size:32px;max-width:820px;line-height:1.15;margin:8px 0}
#ovbg{position:absolute;inset:0;background:center/cover;opacity:.35;image-rendering:pixelated}
#ov > *:not(#ovbg){position:relative}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:15}

#capa{position:fixed;left:0;top:0;width:1324px;height:687px;overflow:hidden;background:#000;text-align:left}
#capa .cbg{position:absolute;left:0;top:-120px;width:1324px;image-rendering:pixelated}
#capa .rain2{position:absolute;left:0;top:0;width:1324px;height:687px;pointer-events:none}
#capa .glow{position:absolute;left:820px;top:170px;width:140px;height:220px;background:radial-gradient(ellipse,rgba(170,20,20,.45),transparent 70%);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
#capa .noose{position:absolute;left:868px;top:282px;transform-origin:16px 0;animation:swing 4.5s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(0,0,0,.9))}
@keyframes swing{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}}
#capa .flash{position:absolute;inset:0;background:#dfe8ff;opacity:0;mix-blend-mode:screen;animation:flash 9s infinite}
@keyframes flash{0%,90%,100%{opacity:0}91%{opacity:.28}92%{opacity:0}93%{opacity:.15}94%{opacity:0}}
#capa .tit{position:absolute;left:770px;top:40px;width:540px;text-align:center}
#capa .t1{font-family:'Press Start 2P';font-size:30px;color:#cdbf9a;letter-spacing:10px;text-shadow:3px 3px 0 #000}
#capa .t2{font-family:'Press Start 2P';font-size:58px;line-height:1.15;color:#e3d6b0;margin-top:10px;text-shadow:4px 4px 0 #3a0606,0 0 30px rgba(190,20,20,.55)}
#capa .t2 span{color:#b3201b;text-shadow:4px 4px 0 #000,0 0 26px rgba(220,30,30,.7)}
#capa .knots{display:flex;justify-content:center;gap:18px;margin:16px 0 6px}
#capa .sub{font-family:'VT323';font-size:26px;color:#9aa6b4;letter-spacing:1px}
#capa .menu{position:absolute;left:1120px;top:440px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
#capa .menu .btn{min-width:320px;font-size:16px;background:linear-gradient(#3a2626,#211414);border-color:#7d4b4b #2a1010 #2a1010 #7d4b4b;color:#e8d8b8}
#capa .menu .btn:hover{color:#ffd27a}
#capa .hint{position:absolute;right:20px;top:8px;font-family:VT323;font-size:20px;color:#6c7682}

#intro{position:fixed;left:0;top:0;width:1324px;height:687px;background:#000;z-index:40;overflow:hidden;display:none;cursor:pointer}
#intro.on{display:block}
#intro .ib{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;image-rendering:pixelated}
#intro .ir{position:absolute;left:0;top:0;width:1324px;height:687px;pointer-events:none}
#intro .ifl{position:absolute;inset:0;background:#e8eeff;opacity:0;mix-blend-mode:screen}
#intro .itx{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#d8d2c0;opacity:0;transition:opacity 1.2s;font-family:'VT323',monospace;font-size:40px;letter-spacing:3px;line-height:1.25;text-shadow:0 0 10px #000}
#intro .itx small{display:block;font-size:26px;color:#8e98a4;letter-spacing:6px;margin-bottom:10px}
#intro .itx b{font-family:'Press Start 2P';font-weight:normal;font-size:26px;color:#e8dfc6;letter-spacing:2px}
#intro .itx i{display:block;font-size:24px;color:#8e98a4;font-style:normal;margin-top:6px}
#intro .ititle{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;opacity:0}
#intro .ititle .a{font-family:'Press Start 2P';font-size:40px;color:#cdbf9a;letter-spacing:14px}
#intro .ititle .b{font-family:'Press Start 2P';font-size:96px;color:#b3201b;margin-top:18px;text-shadow:6px 6px 0 #000,0 0 40px rgba(220,30,30,.8)}
#intro .ititle.shake{animation:ishake .5s}
@keyframes ishake{0%,100%{transform:translateY(-50%)}20%{transform:translate(-8px,-52%)}40%{transform:translate(7px,-48%)}60%{transform:translate(-5px,-51%)}80%{transform:translate(3px,-49%)}}
#intro .iskip{position:absolute;right:18px;bottom:14px;font-family:'Press Start 2P';font-size:13px;color:#7a838e;border:2px solid #3a434e;padding:8px 12px;background:rgba(0,0,0,.6)}
#intro .itap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:'Press Start 2P';font-size:18px;color:#8e98a4;animation:blink 1.4s steps(2) infinite}


#som{position:absolute;left:0;top:0;width:1324px;height:687px;z-index:46;display:none;background:rgba(0,0,0,.6)}
#som.on{display:block}
#som .box{position:absolute;left:332px;top:150px;width:660px;background:#0d0f14;border:4px solid #c9a94a;outline:3px solid #11161d;padding:22px 26px;font-family:'Press Start 2P';color:#e8e2c8}
#som .tt{text-align:center;color:#f0d060;font-size:16px;margin-bottom:24px}
#som .row{display:flex;align-items:center;gap:12px;margin:16px 0}
#som .lb{width:130px;font-size:12px}
#som .pm{width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:#2a323d;border:2px solid #5a6573;font-size:18px;cursor:pointer}
#som .bars{display:flex;gap:4px;flex:1;height:30px}
#som .bars i{flex:1;background:#232a33;border:1px solid #3a4450;cursor:pointer}
#som .bars i.f{background:#c9a94a}
#som .row.off .bars i.f{background:#5a5030}
#som .tg{width:110px;height:46px;display:flex;align-items:center;justify-content:center;font-size:11px;background:#c9a94a;color:#0d0f14;cursor:pointer}
#som .row.off .tg{background:#3a2020;color:#e88}
#som .fc{display:block;margin:26px auto 0;width:200px;text-align:center;padding:14px;background:#2a323d;border:2px solid #5a6573;font-size:12px;cursor:pointer}
#tip{position:absolute;left:0;top:0;width:1324px;height:687px;z-index:45;display:none;cursor:pointer}
#tip.on{display:block}
#tip .hole{position:absolute;border:3px solid #f0d060;border-radius:6px;box-shadow:0 0 0 3000px rgba(0,0,0,.55),0 0 18px #f0d060;animation:tpulse 1s ease-in-out infinite;pointer-events:none}
#tip .hole.none{border:none;box-shadow:0 0 0 3000px rgba(0,0,0,.45);animation:none}
@keyframes tpulse{50%{box-shadow:0 0 0 3000px rgba(0,0,0,.55),0 0 4px #f0d060}}
#tip .bal{position:absolute;width:430px;background:#0d0f14;border:4px solid #c9a94a;outline:3px solid #11161d;padding:14px 16px 10px;color:#e8e2c8;font-family:'VT323',monospace;font-size:27px;line-height:1.1;box-shadow:0 8px 30px rgba(0,0,0,.8)}
#tip .bal b{color:#f0d060;font-weight:normal}
#tip .bal .tt{font-family:'Press Start 2P';font-size:11px;color:#f0d060;margin-bottom:8px}
#tip .bal .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:'Press Start 2P';font-size:10px}
#tip .bal .ok{color:#0d0f14;background:#f0d060;padding:7px 12px}
#tip .bal .skip{color:#7d8794;text-decoration:underline}
#tip .arw{position:absolute;font-size:34px;color:#f0d060;animation:bob2 .8s ease-in-out infinite;text-shadow:0 0 8px #000}
@keyframes bob2{50%{transform:translateY(-8px)}}
#rot{display:none;position:fixed;inset:0;background:#000;color:var(--ink);z-index:50;align-items:center;justify-content:center;text-align:center;font-family:'Press Start 2P';font-size:14px;line-height:2;padding:30px}
</style>
</head>
<body>
<div id="stage" class="side">
  <div id="scene">
    <img id="bg" alt="">
    <img id="raio" alt="" style="position:absolute;left:580px;top:100px;display:none;pointer-events:none;image-rendering:pixelated">
    <div id="hots"></div>
    <div id="sprites"></div>
    <canvas id="rain" width="1024" height="687"></canvas>
    <div id="flashw" style="position:absolute;inset:0;background:#dfe8ff;opacity:0;pointer-events:none;mix-blend-mode:screen"></div>
    <div id="dark"></div>
    <div id="hudl"><div id="money"></div><div id="pistas"></div><div id="timer"></div></div>
    <div id="hud">
      <div class="meter">VIDA <div class="segs" id="mv"></div></div>
      <div class="meter">SANIDADE <div class="segs" id="ms"></div></div>
    </div>
    <div id="whisper"></div>
    <div id="sentence"></div>
    <div id="toast"></div>
    <div id="choices" style="position:absolute;left:50%;transform:translateX(-50%);bottom:30px;width:640px;display:none;flex-direction:column;gap:5px;z-index:18;background:rgba(8,10,14,.88);border:3px solid #3d4a5a;padding:8px"></div>
    <div id="dlg"><div id="por"></div><div id="dtext"><div id="dname"></div><div id="dline"></div></div><div id="dmore">▼</div></div>
    <div id="fade"></div>
  </div>
  <div id="panel">
    <div id="verbs"></div>
    <div id="inv"><h4>INVENTÁRIO</h4></div>
    <div id="tools">
      <div class="btn small" id="bhome">INÍCIO</div>
      <div class="btn small" id="bmap">TÁXI</div>
      <div class="btn small" id="bhint">DICA</div>
      <div class="btn small" id="bsnd">SOM</div>
      <div class="btn small" id="bfs">TELA</div>
      <div class="btn small" id="bhelp">?</div>
    </div>
  </div>
  <div id="ov"><div id="ovbg"></div><div id="ovc"></div></div>
  <div id="som"><div class="box"><div class="tt">SOM</div><div id="somrows"></div><div class="fc">FECHAR</div></div></div>
  <div id="tip"><div class="hole"></div><div class="arw">▼</div><div class="bal"></div></div>
  <div id="intro"><div class="ib"></div><canvas class="ir" width="1324" height="687"></canvas><div class="ifl"></div><div class="itx"></div><div class="ititle"><div class="a">OS PECADOS</div><div class="b">DA FORCA</div></div><div class="iskip">PULAR ▶</div></div>
</div>
<img id="ghost" alt="">
<script>
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const IMG=n=>n+'.webp';

/* ---------------- ÁUDIO ---------------- */
const SNDS=['batidas','latido','rosnado','telefone','pegar','pista','susto','dano','passos-madeira','passos-rua','porta','degrau','isqueiro','cafe','taxi','chuva','chuva-dentro','porao','delegacia','capela','sino','sussurros','musica','tamm','portao','redacao','praia','casa-vo','bau'];
const SFX={ctx:null,on:true,buf:{},master:null,ambSrc:null,ambName:null,stepSrc:null,
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.connect(this.ctx.destination);this.bus={};['mus','amb','fx'].forEach(k=>{const g=this.ctx.createGain();g.connect(this.master);this.bus[k]=g});this.applyVol();
    SNDS.forEach(n=>fetch(n+'.mp3').then(r=>r.arrayBuffer()).then(ab=>new Promise((ok,no)=>this.ctx.decodeAudioData(ab,ok,no))).then(bf=>{this.buf[n]=bf;if(this.wantAmb===n)this.amb(n,true)}).catch(()=>{}))}catch(e){}},
  vol:(()=>{try{return Object.assign({mus:.8,amb:.8,fx:.8,mmus:0,mamb:0,mfx:0},JSON.parse(localStorage.getItem('pecados_som')||'{}'))}catch(e){return{mus:.8,amb:.8,fx:.8,mmus:0,mamb:0,mfx:0}}})(),
  applyVol(){try{localStorage.setItem('pecados_som',JSON.stringify(this.vol))}catch(e){}if(!this.bus)return;['mus','amb','fx'].forEach(k=>{const g=this.bus[k].gain,t=this.ctx.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(this.vol['m'+k]?0:this.vol[k]*1.25,t)})},
  busOf(n){return /^(musica|tamm)$/.test(n)?'mus':/^(chuva|chuva-dentro|porao|delegacia|capela|redacao|praia|casa-vo)$/.test(n)?'amb':'fx'},
  mute(){this.on=!this.on;if(this.master)this.master.gain.setTargetAtTime(this.on?1:0,this.ctx.currentTime,.05)},
  play(n,v=1,loop=false){if(!this.ctx||!this.buf[n])return null;const c=this.ctx,s=c.createBufferSource(),g=c.createGain();s.buffer=this.buf[n];s.loop=loop;g.gain.value=v;s.connect(g).connect(this.bus?this.bus[this.busOf(n)]:this.master);s.start();s._g=g;return s},
  fadeOut(s,t=.8){if(!s)return;try{s._g.gain.setTargetAtTime(0,this.ctx.currentTime,t/4);s.stop(this.ctx.currentTime+t)}catch(e){}},
  amb(n,force){this.wantAmb=n;if(!this.ctx||(!force&&this.ambName===n))return;if(!this.buf[n])return;this.fadeOut(this.ambSrc,1.2);const s=this.play(n,0,true);if(!s)return;s._g.gain.setTargetAtTime(.45,this.ctx.currentTime,.4);this.ambSrc=s;this.ambName=n},
  steps(on,rua){if(on){if(this.stepSrc)return;this.stepSrc=this.play(rua?'passos-rua':'passos-madeira',.55,true)}else{this.fadeOut(this.stepSrc,.15);this.stepSrc=null}},
  tone(f,d,type='sine',v=.2,t0=0,slide=0){if(!this.ctx)return;const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+t0+d);g.gain.setValueAtTime(v,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+d);o.connect(g).connect(this.bus?this.bus.fx:this.master);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+.05)},
  knock(){this.play('batidas')||this.tone(90,.18,'sine',.9,0,45)},
  bark(){this.play('latido',.8)||this.tone(520,.12,'sawtooth',.18,0,260)},
  growl(){this.play('rosnado',.8)},
  ring(){this.play('telefone',.7)||this.tone(440,.5,'square',.08)},
  pick(){this.play('pegar',.8)||this.tone(660,.08,'square',.12)},
  clue(){this.play('pista',.8)||this.tone(523,.25,'triangle',.18)},
  sting(){this.play('susto',.8)||this.tone(70,1.6,'sawtooth',.25,0,40)},
  hurt(){this.play('dano',.9)||this.tone(180,.4,'square',.22,0,60)},
  fx(n,v=.9){this.play(n,v)},
  bell(){this.play('sino',.9)||this.tone(392,2.5,'sine',.2)},
  musica(on){if(on){this.amb('musica')}}
};

    else{hole.className='hole none';Object.assign(hole.style,{left:'662px',top:'343px',width:'0',height:'0'});Object.assign(bal.style,{left:'447px',top:'230px'});arw.style.display='none'}
    T.classList.add('on');
    const done=e=>{e.stopPropagation();e.preventDefault();if(e.target.classList.contains('skip')){TUT.off=true;tutSave()}T.classList.remove('on');T.removeEventListener('click',done,true);setTimeout(res,150)};
    T.addEventListener('click',done,true)}))}
document.addEventListener('pointerdown',()=>{TUT.lastAct=Date.now()},true);
setInterval(()=>{if(!S||busy||dlgResolve||$('#ov').classList.contains('on')||$('#intro').classList.contains('on'))return;
  if(Date.now()-TUT.lastAct>60000&&S.flags.manha)tip('dica','TRAVOU?','O botão <b>DICA</b> mostra tudo o que dá para tocar nesta tela. E em <b>PISTAS (VER)</b> você vê as pistas que faltam, com dicas.','#bhint')},5000);
async function ajuda(){await overlay(`<div class="title" style="font-size:22px">COMO JOGAR</div><div style="text-align:left;font-size:25px;line-height:1.18;max-width:900px;margin:14px auto;color:#e8e2c8">
  <b style="color:#f0d060">Andar:</b> toque no chão.<br>
  <b style="color:#f0d060">Ações:</b> escolha ao lado ANDAR, OLHAR, PEGAR, FALAR ou USAR e toque numa pessoa ou objeto.<br>
  <b style="color:#f0d060">Itens:</b> arraste um item do INVENTÁRIO até alguém ou algo. Arraste um item sobre outro para combinar. Com OLHAR, toque no item para ver o que é.<br>
  <b style="color:#f0d060">Conversas:</b> toque na tela para passar as falas. Suas respostas mudam como as pessoas te tratam.<br>
  <b style="color:#f0d060">Vida e sanidade:</b> perigos tiram vida, sustos tiram sanidade. Se uma zerar, você volta ao último lugar.<br>
  <b style="color:#f0d060">Pistas:</b> toque em PISTAS (VER) para ver o que falta.<br>
  <b style="color:#f0d060">Botões:</b> TÁXI viaja · DICA mostra o que dá pra tocar · INÍCIO salva e volta à capa · SOM ajusta música, ambiente e efeitos · TELA cheia.</div>
  <div class="btn" data-k="r" style="min-width:260px">REVER DICAS</div><div class="btn" data-k="x">FECHAR</div>`,null).then(k=>{if(k==='r'){TUT.seen={};TUT.off=false;tutSave()}});closeOv()}
$('#bhelp').onclick=async e=>{e.stopPropagation();if(busy||dlgResolve)return;busy=true;await ajuda();busy=false};

/* ---------------- ABERTURA ---------------- */
let introSkip=false;
const isl=ms=>new Promise(r=>{const t0=performance.now();const f=()=>{if(introSkip||performance.now()-t0>=ms)r();else setTimeout(f,40)};f()});
function tamm(){if(SFX.play('tamm',1))return;const x=SFX;if(!x.ctx)return;x.tone(55,3.2,'sawtooth',.35,0,30);x.tone(41,3.5,'sine',.6);x.tone(110,2.5,'square',.08,0,55);x.bell();trovao()}
async function abertura(){
  const I=$('#intro'),bg=I.querySelector('.ib'),fl=I.querySelector('.ifl'),tx=I.querySelector('.itx'),ti=I.querySelector('.ititle');
  introSkip=false;I.classList.add('on');tx.style.opacity=0;ti.style.opacity=0;bg.style.opacity=0;
  I.querySelector('.iskip').onclick=e=>{e.stopPropagation();introSkip=true};
  SFX.amb('chuva');
  const card=async(html,ms=2600)=>{if(introSkip)return;tx.innerHTML=html;tx.style.opacity=1;await isl(ms);tx.style.opacity=0;await isl(1300)};
  const raio=async(img,ms=550)=>{if(introSkip)return;bg.style.transition='none';bg.style.backgroundImage=`url(${IMG(img)})`;fl.style.transition='none';fl.style.opacity=.85;bg.style.opacity=1;await isl(70);fl.style.opacity=0;await isl(60);fl.style.opacity=.4;await isl(60);fl.style.opacity=0;await isl(ms);bg.style.transition='opacity .5s';bg.style.opacity=0;setTimeout(trovao,300);await isl(900)};
  await isl(1800);trovao();await isl(1500);
  await card('<small>UMA HISTÓRIA DE</small><b>José Guilherme de Medeiros Souza</b>',3000);
  await raio('parede');
  await card('<small>ESTRELANDO</small>a nossa família',2600);
  const elenco=[['Guilherme Medeiros','o último Medeiros'],['Nathalia Salustiano','sócia do sebo'],['Pedro Onishi','o estagiário'],['Joana Medeiros','a delegada'],['André Campo Piano','o escrivão'],['Sarah Souza','a capoeirista'],['Helena Souza','a legista'],['Vó Maria Izabel','a guardiã do baú'],['Eduardo Campo Piano','o taxista'],['Nori e Tiana','como eles mesmos']];
  for(let k=0;k<elenco.length;k+=2){if(introSkip)break;const a=elenco[k],b=elenco[k+1];await card(`${a[0]}<i>${a[1]}</i><br>${b[0]}<i>${b[1]}</i>`,2300);if(k===2)await raio('bauaberto');if(k===6)await raio('capa2')}
  await card('São Paulo, 1821.<br>A corda do soldado Chaguinhas<br>arrebentou três vezes.',3600);
  await card('O povo pediu perdão.<br>Não houve perdão.',3000);
  await raio('parede',350);
  await card('São Paulo, 1994.',2400);
  if(!introSkip){await isl(600);fl.style.transition='none';fl.style.opacity=1;tamm();ti.style.opacity=1;ti.classList.remove('shake');void ti.offsetWidth;ti.classList.add('shake');await isl(90);fl.style.transition='opacity 1.2s';fl.style.opacity=0;await isl(3800);ti.style.transition='opacity 1.5s';ti.style.opacity=0;await isl(1600);ti.style.transition=''}
  I.classList.remove('on');try{localStorage.setItem('pecados_intro','1')}catch(e){}
}

/* início */
async function inicio(first){
  fit();
  if(first){const I=$('#intro');I.classList.add('on');I.querySelector('.iskip').style.display='none';const tap=document.createElement('div');tap.className='itap';tap.textContent='TOQUE PARA COMEÇAR';I.appendChild(tap);
    await new Promise(r=>I.addEventListener('click',r,{once:true}));tap.remove();I.querySelector('.iskip').style.display='';SFX.init();telaCheia();
    let visto=false;try{visto=!!localStorage.getItem('pecados_intro')}catch(e){}
    if(!visto)await abertura();else I.classList.remove('on')}
  SFX.amb('musica');
  const sv=carregar();
  const k=await overlay(`<div id="capa"><img class="cbg" src="${IMG('capa')}"><canvas class="rain2" width="1324" height="687"></canvas><div class="flash"></div>
    <div class="tit"><div class="t1">OS PECADOS</div><div class="t2">DA <span>FORCA</span></div><div class="knots"><svg width='34' height='40' viewBox='0 0 17 20' shape-rendering='crispEdges'><path d='M8 0v4M5 4h6v2h2v4h-2v2H5v-2H3V6h2zM6 7h4v2H6zM8 12v8' stroke='#8a6a3c' stroke-width='2' fill='none'/></svg><svg width='34' height='40' viewBox='0 0 17 20' shape-rendering='crispEdges'><path d='M8 0v4M5 4h6v2h2v4h-2v2H5v-2H3V6h2zM6 7h4v2H6zM8 12v8' stroke='#8a6a3c' stroke-width='2' fill='none'/></svg><svg width='34' height='40' viewBox='0 0 17 20' shape-rendering='crispEdges'><path d='M8 0v4M5 4h6v2h2v4h-2v2H5v-2H3V6h2zM6 7h4v2H6zM8 12v8' stroke='#8a6a3c' stroke-width='2' fill='none'/></svg></div><div class="sub">São Paulo · 1994<br>Capítulo 1: A Corda que Não Arrebenta</div></div>
    <div class="menu">${sv&&!sv.flags.fim?'<div class="btn" data-k="c">CONTINUAR</div>':''}<div class="btn" data-k="n">NOVO JOGO</div><div class="btn small" data-k="a" style="min-width:200px;font-size:11px">VER ABERTURA</div><div class="btn small" data-k="h" style="min-width:200px;font-size:11px">COMO JOGAR</div></div>
    <div class="hint">Melhor com som e com o celular deitado</div></div>`,null);
  if(k==='a'){closeOv();await abertura();return inicio()}
  if(k==='h'){closeOv();await ajuda();return inicio()}
  SFX.init();SFX.amb(S&&S.scene&&SC[S.scene].amb||'chuva-dentro');closeOv();
  if(k==='c'){S=sv;S._keepG=1;}else{S=novo();}
  const f=$('#fade');f.style.opacity=1;
  await fadeTo(S.scene);
}
inicio(true);
</script>
